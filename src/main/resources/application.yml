spring:
  application:
    name: ai-agent-backend

  ai:
    openai:
      api-key: ""
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        extra-body:                                                                                                                    
                include_reasoning: false 
        # temperature: 0.5

server:
  port: 8082

