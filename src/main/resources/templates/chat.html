<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spring AI Agent · Classic Chat</title>

    <!-- Pre-script to prevent theme flickering on reload -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('chat_theme_mode') || 'light';
            const savedColor = localStorage.getItem('chat_theme_color') || 'blue';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            document.documentElement.setAttribute('data-color', savedColor);
        })();
    </script>

    <!-- Tailwind CSS CDN with dark mode config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased h-screen flex flex-col justify-between overflow-hidden transition-colors duration-200">

    <!-- Main Chat Container -->
    <div class="max-w-4xl w-full mx-auto h-full flex flex-col bg-white dark:bg-slate-900 shadow-xl sm:border-x sm:border-slate-200 dark:sm:border-slate-800 transition-colors duration-200">

        <!-- Classic Header -->
        <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-5 py-3.5 flex items-center justify-between flex-shrink-0 z-20 transition-colors duration-200">
            <!-- Left Info -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full theme-bg flex items-center justify-center text-white shadow-sm ring-2 ring-slate-100 dark:ring-slate-800 transition-colors duration-200">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-base font-semibold text-slate-900 dark:text-slate-100 leading-none">Spring AI Assistant</h1>
                        <span id="statusBadge" class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-2.5 py-0.5 rounded-full border border-emerald-200 dark:border-emerald-800">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                            Online
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Travel, Flights, Hotels &amp; Store Assistant</p>
                </div>
            </div>

            <!-- Right Controls: Color Dropdown + Light/Dark Toggle + Clear -->
            <div class="flex items-center gap-1.5 sm:gap-2">

                <!-- 1. Color Palette Dropdown Menu -->
                <div class="relative">
                    <button type="button"
                            id="colorDropdownBtn"
                            onclick="toggleColorDropdown()"
                            title="Choose Color Theme"
                            class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-colors text-xs font-medium flex items-center gap-1.5">
                        <span id="currentColorDot" class="w-3.5 h-3.5 rounded-full theme-bg shadow-sm"></span>
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <!-- Color Dropdown Popover (8 Colors) -->
                    <div id="colorDropdownMenu"
                         class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-2 z-50 text-xs text-slate-700 dark:text-slate-200">
                        <div class="px-3 py-1.5 text-[11px] font-semibold text-slate-400 dark:text-slate-400 uppercase tracking-wider">
                            Color Palette
                        </div>
                        <button type="button" onclick="selectColorTheme('blue')" class="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/70 transition-colors">
                            <span class="flex items-center gap-2.5"><span class="w-3.5 h-3.5 rounded-full bg-blue-600"></span> Classic Blue</span>
                            <span class="theme-check-blue hidden text-blue-600 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectColorTheme('rose')" class="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/70 transition-colors">
                            <span class="flex items-center gap-2.5"><span class="w-3.5 h-3.5 rounded-full bg-rose-600"></span> Rose / Pink</span>
                            <span class="theme-check-rose hidden text-rose-600 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectColorTheme('emerald')" class="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/70 transition-colors">
                            <span class="flex items-center gap-2.5"><span class="w-3.5 h-3.5 rounded-full bg-emerald-600"></span> Emerald Green</span>
                            <span class="theme-check-emerald hidden text-emerald-600 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectColorTheme('amber')" class="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/70 transition-colors">
                            <span class="flex items-center gap-2.5"><span class="w-3.5 h-3.5 rounded-full bg-amber-600"></span> Warm Amber</span>
                            <span class="theme-check-amber hidden text-amber-600 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectColorTheme('violet')" class="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/70 transition-colors">
                            <span class="flex items-center gap-2.5"><span class="w-3.5 h-3.5 rounded-full bg-violet-600"></span> Royal Violet</span>
                            <span class="theme-check-violet hidden text-violet-600 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectColorTheme('cyan')" class="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/70 transition-colors">
                            <span class="flex items-center gap-2.5"><span class="w-3.5 h-3.5 rounded-full bg-cyan-600"></span> Ocean Cyan</span>
                            <span class="theme-check-cyan hidden text-cyan-600 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectColorTheme('orange')" class="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/70 transition-colors">
                            <span class="flex items-center gap-2.5"><span class="w-3.5 h-3.5 rounded-full bg-orange-600"></span> Sunset Orange</span>
                            <span class="theme-check-orange hidden text-orange-600 font-bold">✓</span>
                        </button>
                        <button type="button" onclick="selectColorTheme('fuchsia')" class="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/70 transition-colors">
                            <span class="flex items-center gap-2.5"><span class="w-3.5 h-3.5 rounded-full bg-fuchsia-600"></span> Magenta Fuchsia</span>
                            <span class="theme-check-fuchsia hidden text-fuchsia-600 font-bold">✓</span>
                        </button>
                    </div>
                </div>

                <!-- 2. Dark/Light Mode Toggle Button -->
                <button type="button"
                        id="themeToggleBtn"
                        onclick="toggleDarkLightMode()"
                        title="Toggle Light / Dark mode"
                        class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-colors text-xs font-medium flex items-center justify-center">
                    <!-- Sun Icon (Shown in Dark Mode) -->
                    <svg id="sunIcon" class="w-4 h-4 text-amber-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <!-- Moon Icon (Shown in Light Mode) -->
                    <svg id="moonIcon" class="w-4 h-4 text-slate-600 dark:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>

                <!-- 3. Clear Chat Button -->
                <button type="button"
                        onclick="clearChat()"
                        title="Clear conversation"
                        class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-colors text-xs font-medium flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span class="hidden sm:inline">Clear</span>
                </button>
            </div>
        </header>

        <!-- Message Feed Area -->
        <main id="chatMessages" class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 scroll-smooth bg-slate-50/50 dark:bg-slate-900/40 transition-colors duration-200">

            <!-- Welcome / Starter Card -->
            <div id="welcomeCard" class="py-8 px-4 text-center max-w-lg mx-auto">
                <div class="w-14 h-14 theme-light-bg theme-text rounded-2xl flex items-center justify-center mx-auto mb-4 border theme-border shadow-sm transition-colors duration-200">
                    <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
                    </svg>
                </div>
                <h2 class="text-xl font-semibold text-slate-800 dark:text-slate-100 mb-1.5">How can I assist you today?</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">
                    Ask me to plan a trip (flights, hotels, weather &amp; budget), or check inventory and customer orders.
                </p>

                <!-- Starter Prompt Chips -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-left">
                    <button type="button"
                            onclick="sendSuggestion('Plan a trip from Paris (CDG) to New York (JFK) on 2026-10-21 for 2 nights with a $1,400 budget. Check flight, hotel under $300/night, and weather.')"
                            class="p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 hover:border-[var(--theme-primary)] hover:shadow-md transition-all text-left group">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-base">✈️</span>
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 group-hover:text-[var(--theme-primary)] transition-colors">Trip to New York</span>
                        </div>
                        <p class="text-[12px] text-slate-400 dark:text-slate-400">Flight + hotel + weather package under budget</p>
                    </button>

                    <button type="button"
                            onclick="sendSuggestion('Find flights from New York (JFK) to London (LHR) on 2026-10-15 and check the weather in London.')"
                            class="p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 hover:border-[var(--theme-primary)] hover:shadow-md transition-all text-left group">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-base">🇬🇧</span>
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 group-hover:text-[var(--theme-primary)] transition-colors">London Flight &amp; Weather</span>
                        </div>
                        <p class="text-[12px] text-slate-400 dark:text-slate-400">Compare flights and packing advice</p>
                    </button>

                    <button type="button"
                            onclick="sendSuggestion('What products are currently in stock in inventory?')"
                            class="p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 hover:border-[var(--theme-primary)] hover:shadow-md transition-all text-left group">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-base">📦</span>
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 group-hover:text-[var(--theme-primary)] transition-colors">In-Stock Products</span>
                        </div>
                        <p class="text-[12px] text-slate-400 dark:text-slate-400">List all warehouse inventory items</p>
                    </button>

                    <button type="button"
                            onclick="sendSuggestion('What is the status of order 1042?')"
                            class="p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 hover:border-[var(--theme-primary)] hover:shadow-md transition-all text-left group">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-base">🔍</span>
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 group-hover:text-[var(--theme-primary)] transition-colors">Track Order #1042</span>
                        </div>
                        <p class="text-[12px] text-slate-400 dark:text-slate-400">Check customer delivery status</p>
                    </button>
                </div>
            </div>

        </main>

        <!-- Classic Bottom Input Bar -->
        <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 sm:px-6 py-4 flex-shrink-0 transition-colors duration-200">
            <div class="flex items-end gap-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-2xl px-4 py-2.5 theme-ring transition-all shadow-inner">
                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
                    class="flex-1 bg-transparent resize-none text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none py-1 leading-relaxed max-h-36"
                    onkeydown="handleKeyDown(event)"
                ></textarea>

                <button
                    id="sendBtn"
                    type="button"
                    onclick="sendMessage()"
                    disabled
                    title="Send message"
                    class="flex-shrink-0 w-9 h-9 rounded-xl theme-bg theme-bg-hover text-white flex items-center justify-center disabled:bg-slate-200 dark:disabled:bg-slate-700 disabled:text-slate-400 dark:disabled:text-slate-500 disabled:cursor-not-allowed transition-all shadow-sm active:scale-95"
                >
                    <svg class="w-4 h-4 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>

            <div class="flex items-center justify-between text-[11px] text-slate-400 dark:text-slate-500 mt-2 px-1">
                <span>Press <kbd class="font-mono bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-1 py-0.5 rounded text-[10px] text-slate-600 dark:text-slate-300">Enter</kbd> to send, <kbd class="font-mono bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-1 py-0.5 rounded text-[10px] text-slate-600 dark:text-slate-300">Shift+Enter</kbd> for newline</span>
                <span>Endpoint: <code class="font-mono theme-text font-semibold">/chat</code></span>
            </div>
        </footer>

    </div>

    <!-- Simple JavaScript Client -->
    <script th:src="@{/js/chat.js}"></script>
</body>
</html>
